<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
    <nav>
        <div class="logo">☕ Cafe Delight</div>
        <ul class="nav-links">
            <li><a href="index.html" onclick="showPage('home')" class="nav-link active">Home</a></li>
            <li><a href="manu.html" onclick="showPage('menu')" class="nav-link">Menu</a></li>
            <li><a href="about.html" onclick="showPage('about')" class="nav-link">About</a></li>
            <li><a href="contact.html" onclick="showPage('contact')" class="nav-link">Contact</a></li>
            <li><a href="login.html" onclick="showPage('login')" class="nav-link">Login</a></li>
        </ul>
        <button class="cart-btn" onclick="toggleCart()">🛒 Cart (<span id="cart-count">0</span>)</button>
    </nav>
</header>
    <div class="form-container">
    <h2>🛍️ Place Your Order</h2>
    <p class="subtitle">Please fill in the details below to complete your order.</p>

    <form action="submit_order.php" method="POST">
        
        <!-- Customer Name -->
        <div class="input-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="John Doe" required>
        </div>

        <!-- Phone Number -->
        <div class="input-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="0300-1234567" required>
        </div>

        <!-- Row for Item Name & Price -->
        <div class="form-row">
            <div class="input-group">
                <label for="item-name">Item Name</label>
                <input type="text" id="item-name" name="item_name" placeholder="Coffee Mug" required>
            </div>
            <div class="input-group">
                <label for="price">Price ($)</label>
                <input type="number" id="price" name="price" placeholder="15.00" step="0.01" required>
            </div>
        </div>

        <!-- Delivery Address -->
        <div class="input-group">
            <label for="address">Delivery Address</label>
            <textarea id="address" name="address" rows="3" placeholder="House #, Street, City" required></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit">Submit Order</button>
    </form>
</div>
</body>
</html>
